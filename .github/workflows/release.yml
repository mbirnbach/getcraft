# Builds GetCraft for every platform when a `v*` tag is pushed. Assets follow the Crafting Apps
# naming scheme (getcraft-<version>-<os>-<arch>.<ext>), which is what GetCraft's self-updater
# looks for.
#
# Signing switches on by itself once these are configured (Settings → Secrets and variables →
# Actions):
#
#   macOS, Developer ID + notarization (secrets):
#     APPLE_CERTIFICATE_P12        base64 of the "Developer ID Application" certificate (.p12)
#     APPLE_CERTIFICATE_PASSWORD   password of that .p12
#     APPLE_API_KEY                base64 of an App Store Connect API key (.p8)
#     APPLE_API_KEY_ID             its key ID
#     APPLE_API_ISSUER_ID          the issuer ID shown above the keys list
#
#   Windows, SignPath Foundation:
#     SIGNPATH_API_TOKEN           secret: API token of the SignPath CI user (submitter)
#     SIGNPATH_ORGANIZATION_ID     variable: the SignPath organization ID
#
# A release is published as a normal release once macOS is signed and notarized (Gatekeeper
# blocks unsigned apps outright). Windows may still be unsigned: SmartScreen only warns on a
# manual first download, and GetCraft's own updates aren't affected. Without macOS signing it's a
# *pre-release*, which GetCraft's self-updater ignores.
name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs are dry runs: everything is built and packaged, nothing is published.
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag must match Cargo.toml: the version is baked into the binaries, and SignPath checks the
  # Windows exe's version against the tag.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$CARGO" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $CARGO in Cargo.toml. Bump Cargo.toml first."
            exit 1
          fi

  macos:
    needs: check-version
    runs-on: macos-latest
    outputs:
      signed: ${{ steps.mode.outputs.signed }}
    env:
      HAS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - id: mode
        run: echo "signed=$HAS_SIGNING" >> "$GITHUB_OUTPUT"
      - run: scripts/bundle-macos.sh release

      - name: Import the Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          test -n "$IDENTITY" || { echo "::error::No Developer ID Application identity in the certificate"; exit 1; }
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Sign and notarize the app
        if: env.HAS_SIGNING == 'true'
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          APP=target/bundle/GetCraft.app
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/GetCraft.zip"
          xcrun notarytool submit "$RUNNER_TEMP/GetCraft.zip" --key "$APPLE_API_KEY_PATH" --key-id "$KEY_ID" --issuer "$ISSUER" --wait --timeout 30m
          # Stapling the app too means it passes Gatekeeper offline after being copied out of the DMG.
          xcrun stapler staple "$APP"

      - name: Ad-hoc sign (no signing secrets configured)
        if: env.HAS_SIGNING != 'true'
        run: codesign --force --deep --sign - target/bundle/GetCraft.app

      - name: Build the DMG
        run: |
          pip3 install --break-system-packages --quiet dmgbuild==1.6.7
          scripts/build-dmg.sh target/bundle/GetCraft.app "target/getcraft-${GITHUB_REF_NAME#v}-macos-universal.dmg"

      - name: Sign, notarize and staple the DMG
        if: env.HAS_SIGNING == 'true'
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          DMG=$(ls target/getcraft-*.dmg)
          codesign --timestamp --sign "$IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY_PATH" --key-id "$KEY_ID" --issuer "$ISSUER" --wait --timeout 30m
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      - name: Remove signing material
        if: always() && env.HAS_SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          path: target/getcraft-*.dmg

  windows:
    needs: check-version
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.mode.outputs.signed }}
    env:
      HAS_SIGNING: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - id: mode
        shell: bash
        run: |
          echo "signed=$HAS_SIGNING" >> "$GITHUB_OUTPUT"
          # From Cargo.toml (which check-version matched against the tag), so dry runs get a real
          # version number too; the installer needs one.
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: cargo build --release -p getcraft --target x86_64-pc-windows-msvc --target aarch64-pc-windows-msvc

      # One folder per architecture; both are signed in a single request (one approval).
      - name: Stage the portable folders
        shell: pwsh
        run: |
          foreach ($pair in @(@("x64", "x86_64-pc-windows-msvc"), @("arm64", "aarch64-pc-windows-msvc"))) {
            $dir = "dist/$($pair[0])"
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item "target/$($pair[1])/release/getcraft.exe" "$dir/GetCraft.exe"
            Copy-Item LICENSE-MIT, LICENSE-APACHE, NOTICE, ATTRIBUTION.md, assets/LICENSE-icon.txt $dir
          }

      - name: Check the executables need no extra runtime
        shell: pwsh
        run: scripts/check-windows-deps.ps1 dist/x64/GetCraft.exe dist/arm64/GetCraft.exe

      - name: Smoke-test the x64 build (the ARM64 build is tested natively in CI)
        shell: pwsh
        run: scripts/windows-smoke-test.ps1 dist/x64/GetCraft.exe

      - name: Upload the unsigned build for SignPath
        if: env.HAS_SIGNING == 'true'
        id: unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-unsigned
          path: dist/

      - name: Sign with SignPath (waits for manual approval)
        if: env.HAS_SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: getcraft
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-portable
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: dist-signed
          parameters: |
            version: ${{ toJSON(env.VERSION) }}

      - name: Use the signed executables
        if: env.HAS_SIGNING == 'true'
        shell: pwsh
        run: |
          foreach ($arch in "x64", "arm64") {
            Copy-Item "dist-signed/$arch/GetCraft.exe" "dist/$arch/GetCraft.exe" -Force
            $sig = Get-AuthenticodeSignature "dist/$arch/GetCraft.exe"
            if ($sig.Status -ne "Valid") { throw "dist/$arch/GetCraft.exe is not validly signed: $($sig.StatusMessage)" }
            Write-Host "$arch signed by $($sig.SignerCertificate.Subject)"
          }

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup isn't installed on this runner" }
          & $iscc /Qp "/DAppVersion=$env:VERSION" "/DStage=$PWD\dist" packaging\windows\getcraft.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Test the installer (install, start, uninstall)
        shell: pwsh
        run: scripts/windows-installer-test.ps1 "dist/getcraft-$env:VERSION-windows-setup.exe"

      - name: Zip the portable builds
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Move-Item "dist/getcraft-$env:VERSION-windows-setup.exe" out/
          foreach ($arch in "x64", "arm64") {
            Remove-Item -Recurse -Force "pkg" -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force "pkg/GetCraft" | Out-Null
            Copy-Item "dist/$arch/*" "pkg/GetCraft/"
            Compress-Archive -Path pkg/GetCraft -DestinationPath "out/getcraft-$env:VERSION-windows-$arch-portable.zip"
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: |
            out/*.zip
            out/*-setup.exe

  linux:
    needs: check-version
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - run: cargo build --release -p getcraft
      - name: Build the AppImage
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p AppDir/usr/bin AppDir/usr/share/doc/getcraft dist
          cp target/release/getcraft AppDir/usr/bin/getcraft
          cp LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md assets/LICENSE-icon.txt AppDir/usr/share/doc/getcraft/
          cp assets/getcraft-256.png AppDir/getcraft.png
          ln -s usr/bin/getcraft AppDir/AppRun
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=GetCraft' \
            'Comment=Install and update the Crafting Apps' 'Exec=getcraft' 'Icon=getcraft' \
            'Categories=Utility;' 'Terminal=false' > AppDir/getcraft.desktop
          # Pinned tool and runtime, checked against known hashes, so a changed upstream file can't
          # end up inside our release.
          case "${{ matrix.arch }}" in
            x86_64)  TOOL_SHA=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
                     RUNTIME_SHA=2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d ;;
            aarch64) TOOL_SHA=f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
                     RUNTIME_SHA=00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444 ;;
          esac
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${{ matrix.arch }}.AppImage"
          curl -fsSL -o runtime "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-${{ matrix.arch }}"
          echo "$TOOL_SHA  appimagetool" | sha256sum -c -
          echo "$RUNTIME_SHA  runtime" | sha256sum -c -
          chmod +x appimagetool
          ARCH=${{ matrix.arch }} ./appimagetool --appimage-extract-and-run --runtime-file runtime AppDir "dist/getcraft-$VERSION-linux-${{ matrix.arch }}.AppImage"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.AppImage

  publish:
    needs: [macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the build provenance attestations (see docs/VERIFY.md).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: "{macos,windows,linux-*}"
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS.txt
      # Installed copies of GetCraft only update to builds signed with this key (minisign); the
      # public half is compiled in from keys/update-signing.pub.
      - name: Sign the builds for GetCraft's self-updater
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          # A build without a real public key could never verify (and so never install) a later
          # update, which would strand its users. Refuse to publish one.
          if ! grep -q '^RW' keys/update-signing.pub; then
            echo "::error::No update signing key in keys/update-signing.pub; run scripts/setup-update-signing.sh first"
            exit 1
          fi
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::The MINISIGN_SECRET_KEY secret is missing"
            exit 1
          fi
          sudo apt-get install -y -qq minisign
          KEY="$RUNNER_TEMP/update.key"
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$KEY")
          cd dist
          for f in getcraft-* SHA256SUMS.txt; do
            minisign -S -s "$KEY" -m "$f"
            minisign -V -p "$GITHUB_WORKSPACE/keys/update-signing.pub" -m "$f" > /dev/null
          done
          rm -f "$KEY"
      # Signed statements, stored by GitHub, that these files were built by this workflow run
      # from this commit. Check with `gh attestation verify <file> --repo mbirnbach/getcraft`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/getcraft-*.dmg
            dist/getcraft-*.exe
            dist/getcraft-*.zip
            dist/getcraft-*.AppImage
            dist/SHA256SUMS.txt
      - name: Describe how this release was built
        env:
          MACOS_SIGNED: ${{ needs.macos.outputs.signed }}
          WINDOWS_SIGNED: ${{ needs.windows.outputs.signed }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$MACOS_SIGNED" = true ]; then MACOS="signed with Developer ID and notarized by Apple"; else MACOS="**not** signed or notarized (ad-hoc signature only)"; fi
          if [ "$WINDOWS_SIGNED" = true ]; then WINDOWS="code-signed via SignPath"; else WINDOWS="**not** code-signed (Windows SmartScreen may warn)"; fi
          {
            echo "### Build provenance"
            echo
            echo "- Source commit: [\`$GITHUB_SHA\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)"
            echo "- Built by: [Release workflow run #$GITHUB_RUN_NUMBER]($RUN_URL) ([\`release.yml\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/.github/workflows/release.yml))"
            echo "- macOS: $MACOS"
            echo "- Windows: $WINDOWS"
            echo "- Every download (\`getcraft-*\`) and \`SHA256SUMS.txt\` is signed with GetCraft's update key (\`.minisig\` files) and has a GitHub build provenance attestation"
            echo
            echo "How to check all of this yourself: [docs/VERIFY.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/VERIFY.md)"
            echo
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          # Without a notarized macOS build it stays a pre-release, which the self-updater ignores.
          prerelease: ${{ needs.macos.outputs.signed != 'true' || contains(github.ref_name, '-') }}
