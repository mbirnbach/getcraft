# The curated list of tools GetCraft knows about.
#
# Every entry points at a GitHub repository whose releases follow the Crafting Apps naming scheme
# (`<id>-<version>-<os>-<arch>.<ext>`). Tools in the `storytold` organisation that are *not* listed
# here are still discovered automatically (see `discovery` below); listing them just gives them a
# proper name, description and category.
#
# This file is compiled into the launcher as a fallback and also fetched from the main branch at
# runtime, so adding a tool here reaches existing installs without shipping a new launcher.

[discovery]
owners = ["storytold"]
# Repositories ending in "craft" that are not desktop apps (or are handled elsewhere).
ignore = ["artcraft", "artcraftx", "placeholder-artcraft", "photocraft-corpus", "craft-fonts"]

[[category]]
id = "image"
name = "Image & Photo"

[[category]]
id = "design"
name = "Graphic Design"

[[category]]
id = "video"
name = "Video & Motion"

[[category]]
id = "office"
name = "Documents & Office"

[[category]]
id = "audio"
name = "Audio"

[[category]]
id = "cad"
name = "CAD"

[[tool]]
id = "photocraft"
name = "PhotoCraft"
repo = "storytold/photocraft"
category = "image"
kind = "Image editor"
description = "The open-source image editor you already know how to use."

[[tool]]
id = "vectorcraft"
name = "VectorCraft"
repo = "storytold/vectorcraft"
category = "design"
kind = "Vector illustration"
description = "Fast, open-source vector illustration, reimagined in pure Rust."

